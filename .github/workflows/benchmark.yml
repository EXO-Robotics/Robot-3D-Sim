name: Verify EXO Bench

on:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "benchmark/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU benchmark runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install mujoco==3.3.6 numpy==2.2.6 pytest==8.4.1
          python -m pip install --no-deps -e .
      - run: exo-bench verify-artifacts --course BASIC-001
      - run: pytest
      - run: exo-bench qualify --output qualification-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: exo-bench-qualification
          path: qualification-ci.json


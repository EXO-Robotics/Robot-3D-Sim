name: Verify EXO Bench

on:
  push:
    branches: [main]
    paths:
      - "benchmark/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark.yml"
  pull_request:
    paths:
      - "benchmark/**"
      - "schemas/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.2"
          enable-cache: true
      - name: Materialize the frozen CPU runtime
        run: uv sync --frozen --extra dev --python 3.12
      - run: uv run --frozen exo-bench verify-artifacts --course BASIC-001
      - run: uv run --frozen pytest
      - run: uv run --frozen exo-bench qualify --output qualification-ci.json --evidence-dir qualification-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: exo-bench-qualification
          path: |
            qualification-ci.json
            qualification-evidence/
